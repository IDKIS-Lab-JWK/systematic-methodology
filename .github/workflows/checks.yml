name: Framework checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU verification dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy pandas scikit-learn nibabel SimpleITK monai pytest
      - name: Public command-line help
        run: python -B run.py --help
      - name: Focused public tests
        run: python -B -m pytest Code/framework/tests Code/inference/tests -q -p no:cacheprovider
      - name: Shared workflow contracts
        run: python -B -m pytest Code/Models/_linear_probe/tests Code/Models/_supervised_adaptation/tests -q -p no:cacheprovider

